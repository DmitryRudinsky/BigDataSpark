plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = 'ru.mai.highload'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.apache.spark:spark-sql_2.12:3.5.1'
    implementation 'org.postgresql:postgresql:42.7.10'
    implementation('com.clickhouse:clickhouse-jdbc:0.9.8') {
        exclude group: 'at.yawk.lz4', module: 'lz4-java'
    }
    implementation 'org.lz4:lz4-java:1.8.0'

    implementation('com.datastax.spark:spark-cassandra-connector_2.12:3.5.1') {
        exclude group: 'org.apache.spark'
    }
    implementation('org.mongodb.spark:mongo-spark-connector_2.12:10.6.1') {
        exclude group: 'org.apache.spark'
    }

    implementation 'org.apache.cassandra:java-driver-core:4.19.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

shadowJar {
    mergeServiceFiles()

    relocate 'com.google.common', 'ru.mai.highload.shaded.com.google.common'
}
